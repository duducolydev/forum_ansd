# Production (brief §3.1, §8) : app, mysql, redis, nginx + Let's Encrypt.
# Pas de Mailpit/MinIO (SMTP et stockage réels, cf. .env.example / PLAN.md C5, C6, C7).
name: forum-ansd

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      STORAGE_DRIVER: ${STORAGE_DRIVER}
      STORAGE_LOCAL_PATH: /app/storage
      AUTH_URL: ${PUBLIC_BASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      BADGE_HMAC_SECRET: ${BADGE_HMAC_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    volumes:
      - storage_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # 127.0.0.1 plutôt que `localhost` : dans le conteneur, `/etc/hosts` associe
      # `localhost` à 127.0.0.1 **et** à ::1. Le wget de BusyBox retient la
      # première adresse renvoyée — ::1 — et n'essaie jamais l'autre, alors que
      # Next écoute sur 0.0.0.0, donc en IPv4 seulement. La sonde échouait ainsi
      # indéfiniment (conteneur « unhealthy ») sur une application par ailleurs
      # saine, que nginx servait sans broncher.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificat en service : le joker `*.ansd.sn` de la DSI, déposé à la main
      # sur le serveur. Le dossier est exclu du dépôt (.gitignore) parce qu'il
      # porte la clé privée du domaine. En lecture seule : nginx lit, n'écrit
      # jamais.
      - ./docker/certs:/etc/nginx/certs:ro
      # Volumes de certbot, gardés bien que le service dorme (profil `tls`).
      # Vides, ils ne coûtent rien, et ils laissent le défi ACME opérationnel le
      # jour où le portail reprendrait un certificat à lui.
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - app

  # Outils d'exploitation : migrations, données de référence, création d'un
  # compte d'administration.
  #
  # L'image de production ne les embarque pas — elle ne contient que le serveur
  # Next compilé, sans le client Prisma en ligne de commande ni `tsx` (voir le
  # Dockerfile, étage `runner`). Ce service reprend l'étage `builder`, qui les a
  # tous, et ne démarre **jamais** avec la pile : son profil le réserve à un
  # `run --rm`, le temps d'une commande.
  #
  #   docker compose -f docker-compose.prod.yml run --rm outils pnpm prisma migrate deploy
  #   docker compose -f docker-compose.prod.yml run --rm outils pnpm db:seed
  #   docker compose -f docker-compose.prod.yml run --rm outils pnpm create:admin …
  outils:
    profiles: ["outils"]
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_DRIVER: ${STORAGE_DRIVER}
      STORAGE_LOCAL_PATH: /app/storage
      AUTH_SECRET: ${AUTH_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      BADGE_HMAC_SECRET: ${BADGE_HMAC_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    volumes:
      - storage_data:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # Renouvellement automatique d'un certificat Let's Encrypt — **en sommeil**.
  #
  # Le portail est servi depuis le 24 septembre 2026 par le certificat joker
  # `*.ansd.sn` de la DSI, que celle-ci renouvelle pour tout le parc. Certbot n'a
  # donc rien à renouveler, et le laisser tourner ferait échouer une tentative
  # toutes les douze heures, dans des journaux que personne ne lit.
  #
  # Mis sous profil plutôt que commenté : un service commenté se périme en
  # silence, au fil des versions d'image et des options qui changent. Sous
  # profil, il ne démarre pas avec la pile mais reste une définition valide, que
  # Compose vérifie et qu'un `run --rm` réveille pour une émission manuelle
  # (§5.4 du guide de déploiement).
  certbot:
    profiles: ["tls"]
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  mysql_data:
  redis_data:
  storage_data:
  certbot_www:
  certbot_conf:
