# Production (brief §3.1, §8) : app, mysql, redis, nginx + Let's Encrypt.
# Pas de Mailpit/MinIO (SMTP et stockage réels, cf. .env.example / PLAN.md C5, C6, C7).
name: forum-ansd

services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      # Écrit ici et non dans le `.env` : la protection des données de
      # production (seed, Prisma, scripts de démonstration — src/lib/environnement.ts)
      # ne doit pas dépendre d'une ligne qu'on oublie de recopier.
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      # Adresse de réponse. Vide, les réponses vont à celle de SMTP_FROM.
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      # Plafond du plan souscrit, pour `pnpm envois:projection` seulement.
      SMTP_PLAFOND_QUOTIDIEN: ${SMTP_PLAFOND_QUOTIDIEN:-}
      # Seconde boîte, pour les envois en nombre (rappels, invitations, envois
      # groupés). Vides, les campagnes repartent sur la boîte ci-dessus —
      # le réglage normal depuis la bascule sur Mailjet (un seul plan).
      SMTP_CAMPAGNE_HOST: ${SMTP_CAMPAGNE_HOST:-}
      SMTP_CAMPAGNE_PORT: ${SMTP_CAMPAGNE_PORT:-}
      SMTP_CAMPAGNE_USER: ${SMTP_CAMPAGNE_USER:-}
      SMTP_CAMPAGNE_PASSWORD: ${SMTP_CAMPAGNE_PASSWORD:-}
      SMTP_CAMPAGNE_FROM: ${SMTP_CAMPAGNE_FROM:-}
      SMTP_CAMPAGNE_PLAFOND_QUOTIDIEN: ${SMTP_CAMPAGNE_PLAFOND_QUOTIDIEN:-}
      # Boîte « Accès » (badges, liens de connexion) — découpage du 20/11/2026, voir lib/mail.ts.
      SMTP_ACCES_HOST: ${SMTP_ACCES_HOST:-}
      SMTP_ACCES_PORT: ${SMTP_ACCES_PORT:-}
      SMTP_ACCES_USER: ${SMTP_ACCES_USER:-}
      SMTP_ACCES_PASSWORD: ${SMTP_ACCES_PASSWORD:-}
      SMTP_ACCES_FROM: ${SMTP_ACCES_FROM:-}
      SMTP_ACCES_PLAFOND_QUOTIDIEN: ${SMTP_ACCES_PLAFOND_QUOTIDIEN:-}
      # Boîte « Inscription » (accusés, imports, invitations) — découpage du 20/11/2026, voir lib/mail.ts.
      SMTP_INSCRIPTION_HOST: ${SMTP_INSCRIPTION_HOST:-}
      SMTP_INSCRIPTION_PORT: ${SMTP_INSCRIPTION_PORT:-}
      SMTP_INSCRIPTION_USER: ${SMTP_INSCRIPTION_USER:-}
      SMTP_INSCRIPTION_PASSWORD: ${SMTP_INSCRIPTION_PASSWORD:-}
      SMTP_INSCRIPTION_FROM: ${SMTP_INSCRIPTION_FROM:-}
      SMTP_INSCRIPTION_PLAFOND_QUOTIDIEN: ${SMTP_INSCRIPTION_PLAFOND_QUOTIDIEN:-}
      # Boîte « Participation » (confirmations du comité) — découpage du 20/11/2026, voir lib/mail.ts.
      SMTP_PARTICIPATION_HOST: ${SMTP_PARTICIPATION_HOST:-}
      SMTP_PARTICIPATION_PORT: ${SMTP_PARTICIPATION_PORT:-}
      SMTP_PARTICIPATION_USER: ${SMTP_PARTICIPATION_USER:-}
      SMTP_PARTICIPATION_PASSWORD: ${SMTP_PARTICIPATION_PASSWORD:-}
      SMTP_PARTICIPATION_FROM: ${SMTP_PARTICIPATION_FROM:-}
      SMTP_PARTICIPATION_PLAFOND_QUOTIDIEN: ${SMTP_PARTICIPATION_PLAFOND_QUOTIDIEN:-}
      # Autorité de certification supplémentaire (18 novembre 2026).
      #
      # Le FortiGate de l'ANSD **inspecte le SSL** : il intercepte la connexion
      # vers le relais SMTP interne et la re-signe avec sa propre autorité
      # (`issuer=O=Fortinet, CN=FG181FTK21900836`). Node refuse cette autorité
      # qu'il ne connaît pas — `unable to verify the first certificate`.
      #
      # Déposer le certificat du Fortinet dans `certs/`, puis pointer cette
      # variable dessus. La connexion reste alors **chiffrée et vérifiée** :
      # c'est une autorité de plus, pas une vérification désactivée.
      #
      # Vide, Node l'ignore : rien ne change tant que le fichier n'est pas là.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      # Relevé des rebonds : vides, ils sont déduits du SMTP Gmail (README).
      # Mailjet traite ses rebonds chez lui — rien n'arrive en IMAP. Pointer ces
      # variables sur l'ancienne boîte Gmail recueille encore les avis des
      # messages partis avant la bascule du 19 novembre 2026.
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      STORAGE_DRIVER: ${STORAGE_DRIVER}
      STORAGE_LOCAL_PATH: /app/storage
      AUTH_URL: ${PUBLIC_BASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      BADGE_HMAC_SECRET: ${BADGE_HMAC_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Jeton de l'export du corpus public (docs/ASSISTANT-RECHERCHE.md).
      #
      # Repli explicite sur le vide : la variable n'existe pas forcément dans le
      # `.env` du serveur, et Compose refuserait de démarrer en la réclamant.
      # Vide, la route reste ouverte — ce que `modules/corpus/jeton.ts` assume.
      #
      # Ce bloc `environment` énumère les variables une à une : une ligne
      # ajoutée au seul `.env` n'atteint **pas** le conteneur. Un jeton posé là
      # sans cette ligne-ci laisserait la route ouverte en croyant l'avoir
      # fermée, et rien ne le signalerait.
      CORPUS_TOKEN: ${CORPUS_TOKEN:-}
    volumes:
      - storage_data:/app/storage
      # Autorités supplémentaires, en lecture seule. Le dossier peut rester
      # vide : seule `NODE_EXTRA_CA_CERTS` décide si un fichier est lu.
      - ./certs:/app/certs:ro
    # Le certificat présenté par le relais couvre `*.ansd.sn`, jamais une
    # adresse IP : s'y connecter par `10.7.0.32` échouerait sur le nom, même
    # l'autorité reconnue. On garde donc le nom et on corrige la résolution —
    # le DNS renvoie l'adresse publique, injoignable depuis l'intérieur du
    # réseau (retour en épingle).
    extra_hosts:
      - "mail.ansd.sn:10.7.0.32"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # 127.0.0.1 plutôt que `localhost` : dans le conteneur, `/etc/hosts` associe
      # `localhost` à 127.0.0.1 **et** à ::1. Le wget de BusyBox retient la
      # première adresse renvoyée — ::1 — et n'essaie jamais l'autre, alors que
      # Next écoute sur 0.0.0.0, donc en IPv4 seulement. La sonde échouait ainsi
      # indéfiniment (conteneur « unhealthy ») sur une application par ailleurs
      # saine, que nginx servait sans broncher.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SISEP, servi par ce même nginx sur `sisephasaoc.ansd.sn` (DEPLOIEMENT.md
      # §5.10). Le nom monté doit trier après `default.conf` : voir l'en-tête
      # du fichier.
      - ./docker/nginx-sisephasaoc.conf:/etc/nginx/conf.d/sisephasaoc.conf:ro
      # Certificat en service : le joker `*.ansd.sn` de la DSI, déposé à la main
      # sur le serveur. Le dossier est exclu du dépôt (.gitignore) parce qu'il
      # porte la clé privée du domaine. En lecture seule : nginx lit, n'écrit
      # jamais.
      - ./docker/certs:/etc/nginx/certs:ro
      # Volumes de certbot, gardés bien que le service dorme (profil `tls`).
      # Vides, ils ne coûtent rien, et ils laissent le défi ACME opérationnel le
      # jour où le portail reprendrait un certificat à lui.
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - app

  # Outils d'exploitation : migrations, données de référence, création d'un
  # compte d'administration.
  #
  # L'image de production ne les embarque pas — elle ne contient que le serveur
  # Next compilé, sans le client Prisma en ligne de commande ni `tsx` (voir le
  # Dockerfile, étage `runner`). Ce service reprend l'étage `builder`, qui les a
  # tous, et ne démarre **jamais** avec la pile : son profil le réserve à un
  # `run --rm`, le temps d'une commande.
  #
  #   docker compose -f docker-compose.prod.yml run --rm outils pnpm prisma migrate deploy
  #   docker compose -f docker-compose.prod.yml run --rm outils pnpm create:admin …
  #
  # `APP_ENV: production` y refuse ce qui pourrait vider ou polluer la base :
  # `prisma migrate reset|dev`, `db push`, le seed de démonstration,
  # `comptes:demo`. Le seed lui-même n'écrit plus rien sur une base initialisée.
  outils:
    profiles: ["outils"]
    build:
      context: .
      target: builder
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_DRIVER: ${STORAGE_DRIVER}
      STORAGE_LOCAL_PATH: /app/storage
      AUTH_SECRET: ${AUTH_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      BADGE_HMAC_SECRET: ${BADGE_HMAC_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Boîtes d'envoi : `pnpm boites:verifier` les authentifie avant qu'une
      # campagne ne compte dessus. Sans elles ici, le script ne verrait qu'une
      # configuration vide et conclurait à tort.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_PLAFOND_QUOTIDIEN: ${SMTP_PLAFOND_QUOTIDIEN:-}
      SMTP_CAMPAGNE_HOST: ${SMTP_CAMPAGNE_HOST:-}
      SMTP_CAMPAGNE_PORT: ${SMTP_CAMPAGNE_PORT:-}
      SMTP_CAMPAGNE_USER: ${SMTP_CAMPAGNE_USER:-}
      SMTP_CAMPAGNE_PASSWORD: ${SMTP_CAMPAGNE_PASSWORD:-}
      SMTP_CAMPAGNE_FROM: ${SMTP_CAMPAGNE_FROM:-}
      SMTP_CAMPAGNE_PLAFOND_QUOTIDIEN: ${SMTP_CAMPAGNE_PLAFOND_QUOTIDIEN:-}
      # Boîte « Accès » (badges, liens de connexion) — découpage du 20/11/2026, voir lib/mail.ts.
      SMTP_ACCES_HOST: ${SMTP_ACCES_HOST:-}
      SMTP_ACCES_PORT: ${SMTP_ACCES_PORT:-}
      SMTP_ACCES_USER: ${SMTP_ACCES_USER:-}
      SMTP_ACCES_PASSWORD: ${SMTP_ACCES_PASSWORD:-}
      SMTP_ACCES_FROM: ${SMTP_ACCES_FROM:-}
      SMTP_ACCES_PLAFOND_QUOTIDIEN: ${SMTP_ACCES_PLAFOND_QUOTIDIEN:-}
      # Boîte « Inscription » (accusés, imports, invitations) — découpage du 20/11/2026, voir lib/mail.ts.
      SMTP_INSCRIPTION_HOST: ${SMTP_INSCRIPTION_HOST:-}
      SMTP_INSCRIPTION_PORT: ${SMTP_INSCRIPTION_PORT:-}
      SMTP_INSCRIPTION_USER: ${SMTP_INSCRIPTION_USER:-}
      SMTP_INSCRIPTION_PASSWORD: ${SMTP_INSCRIPTION_PASSWORD:-}
      SMTP_INSCRIPTION_FROM: ${SMTP_INSCRIPTION_FROM:-}
      SMTP_INSCRIPTION_PLAFOND_QUOTIDIEN: ${SMTP_INSCRIPTION_PLAFOND_QUOTIDIEN:-}
      # Boîte « Participation » (confirmations du comité) — découpage du 20/11/2026, voir lib/mail.ts.
      SMTP_PARTICIPATION_HOST: ${SMTP_PARTICIPATION_HOST:-}
      SMTP_PARTICIPATION_PORT: ${SMTP_PARTICIPATION_PORT:-}
      SMTP_PARTICIPATION_USER: ${SMTP_PARTICIPATION_USER:-}
      SMTP_PARTICIPATION_PASSWORD: ${SMTP_PARTICIPATION_PASSWORD:-}
      SMTP_PARTICIPATION_FROM: ${SMTP_PARTICIPATION_FROM:-}
      SMTP_PARTICIPATION_PLAFOND_QUOTIDIEN: ${SMTP_PARTICIPATION_PLAFOND_QUOTIDIEN:-}
      # Autorité de certification supplémentaire (18 novembre 2026).
      #
      # Le FortiGate de l'ANSD **inspecte le SSL** : il intercepte la connexion
      # vers le relais SMTP interne et la re-signe avec sa propre autorité
      # (`issuer=O=Fortinet, CN=FG181FTK21900836`). Node refuse cette autorité
      # qu'il ne connaît pas — `unable to verify the first certificate`.
      #
      # Déposer le certificat du Fortinet dans `certs/`, puis pointer cette
      # variable dessus. La connexion reste alors **chiffrée et vérifiée** :
      # c'est une autorité de plus, pas une vérification désactivée.
      #
      # Vide, Node l'ignore : rien ne change tant que le fichier n'est pas là.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
    volumes:
      - storage_data:/app/storage
      # Autorités supplémentaires, en lecture seule. Le dossier peut rester
      # vide : seule `NODE_EXTRA_CA_CERTS` décide si un fichier est lu.
      - ./certs:/app/certs:ro
    # Le certificat présenté par le relais couvre `*.ansd.sn`, jamais une
    # adresse IP : s'y connecter par `10.7.0.32` échouerait sur le nom, même
    # l'autorité reconnue. On garde donc le nom et on corrige la résolution —
    # le DNS renvoie l'adresse publique, injoignable depuis l'intérieur du
    # réseau (retour en épingle).
    extra_hosts:
      - "mail.ansd.sn:10.7.0.32"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # Renouvellement automatique d'un certificat Let's Encrypt — **en sommeil**.
  #
  # Le portail est servi depuis le 24 septembre 2026 par le certificat joker
  # `*.ansd.sn` de la DSI, que celle-ci renouvelle pour tout le parc. Certbot n'a
  # donc rien à renouveler, et le laisser tourner ferait échouer une tentative
  # toutes les douze heures, dans des journaux que personne ne lit.
  #
  # Mis sous profil plutôt que commenté : un service commenté se périme en
  # silence, au fil des versions d'image et des options qui changent. Sous
  # profil, il ne démarre pas avec la pile mais reste une définition valide, que
  # Compose vérifie et qu'un `run --rm` réveille pour une émission manuelle
  # (§5.4 du guide de déploiement).
  certbot:
    profiles: ["tls"]
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  mysql_data:
  redis_data:
  storage_data:
  certbot_www:
  certbot_conf:
