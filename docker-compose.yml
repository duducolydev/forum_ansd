# Environnement de développement (brief §3.1, décision PLAN.md C5).
# Démarrage : `docker compose up`, puis dans un autre terminal :
#   docker compose exec app pnpm prisma migrate deploy
#   docker compose exec app pnpm db:seed
name: forum-ansd

services:
  app:
    build:
      context: .
      target: deps
    command: sh -c "pnpm prisma generate && pnpm dev"
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://forum:forum@mysql:3306/forum_ansd
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "Forum international sur les données <forum@ansd.sn>"
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: /app/storage
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      BADGE_HMAC_SECRET: ${BADGE_HMAC_SECRET}
      PUBLIC_BASE_URL: http://localhost:3000
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - ./storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: forum_ansd
      MYSQL_USER: forum
      MYSQL_PASSWORD: forum
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Boîte mail de dev (brief §11) : UI sur http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  # Stockage S3-compatible optionnel (brief §11) : `docker compose --profile storage up`
  minio:
    image: minio/minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  redis_data:
  minio_data:
  app_node_modules:
