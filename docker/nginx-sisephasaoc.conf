# SISEP (suivi-évaluation du PHASAOC), servi par le même nginx que le portail.
#
# Le serveur 10.7.200.41 n'a qu'une paire de ports 80/443, et c'est ce nginx
# qui la tient. SISEP tourne dans sa propre composition (/opt/sisep) : son
# conteneur `web` se raccorde au réseau `forum-ansd_default` sous le nom
# `sisep-web`, et ce fichier le relaie pour `sisephasaoc.ansd.sn`. nginx
# choisit le bloc d'après le nom demandé : le portail ne voit pas la
# différence.
#
# Monté par docker-compose.prod.yml sur `conf.d/sisephasaoc.conf`, et le nom
# compte. nginx lit conf.d/ dans l'ordre alphabétique, et le premier bloc lu
# pour un port en devient le serveur par défaut. `default.conf` doit rester
# devant : toute adresse inconnue, IP comprise, continue ainsi d'aboutir au
# portail (bloc du port 80 de nginx.conf).
#
# Une règle guide le reste : rien de ce qui arrive à SISEP ne doit pouvoir
# faire tomber le portail.

server {
    listen 80;
    server_name sisephasaoc.ansd.sn;
    return 301 https://sisephasaoc.ansd.sn$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sisephasaoc.ansd.sn;

    # Le joker `*.ansd.sn` du portail couvre aussi ce nom : un seul
    # remplacement, un seul rechargement pour les deux sites
    # (docs/CERTIFICAT.md).
    ssl_certificate     /etc/nginx/certs/ansd.crt;
    ssl_certificate_key /etc/nginx/certs/ansd.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Pas d'includeSubDomains : ce bloc ne parle que pour son nom. Les autres
    # en-têtes de sécurité viennent du nginx de SISEP lui-même ; les reposer
    # ici les enverrait en double.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Aligné sur le nginx de SISEP (52 Mo, pour la bibliothèque documentaire).
    # Au défaut de 1 Mo, les dépôts de fichiers échoueraient ici, avant même
    # d'atteindre l'application.
    client_max_body_size 52M;

    # Résolu à chaque requête par le DNS de Docker, et non au démarrage. Écrit
    # en dur dans proxy_pass, un SISEP arrêté empêcherait ce nginx de démarrer
    # (« host not found in upstream ») et le portail tomberait avec lui. Ainsi,
    # seul sisephasaoc.ansd.sn répond 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $sisep http://sisep-web:80;

    location / {
        proxy_pass $sisep;
        proxy_set_header Host $host;
        # Écrasée, jamais complétée, pour la même raison que le portail :
        # SISEP inscrit cette adresse dans son journal d'activité.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        # Les exports de SISEP peuvent prendre quelques secondes.
        proxy_read_timeout 120s;
    }
}
