# Reverse proxy de production (brief §3.1, §7) — HTTPS via Let's Encrypt/certbot.
#
# Domaine arrêté le 22 septembre 2026 : `forum2026.ansd.sn` (décision C6). Il
# figure ici à quatre endroits — les deux `server_name` et les deux chemins de
# certificat — et un seul oublié suffit : nginx servirait alors le certificat
# d'un autre nom, que le navigateur refuserait.

server {
    listen 80;
    server_name forum2026.ansd.sn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name forum2026.ansd.sn;

    ssl_certificate     /etc/letsencrypt/live/forum2026.ansd.sn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum2026.ansd.sn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 55M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Adresse du visiteur : **écrasée** avec celle de la connexion, jamais
        # complétée. `$proxy_add_x_forwarded_for` gardait en tête l'en-tête
        # envoyé par le client, que l'application lisait : n'importe qui
        # choisissait son IP et contournait les limites de débit (PLAN.md §18).
        # L'application lit X-Real-IP (src/lib/adresse-client.ts).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
