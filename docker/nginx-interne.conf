# Reverse proxy pour un déploiement **interne**, sans TLS (PLAN.md §27).
#
# Le portail est servi en clair sur le réseau de l'ANSD, le temps de la recette.
# Deux conséquences à connaître, et à lever avant toute ouverture au public :
#
#   - les mots de passe du BackOffice circulent en clair sur le réseau local ;
#   - le **scanner de badges ne peut pas allumer la caméra** : les navigateurs
#     réservent `getUserMedia` aux origines sécurisées. La recherche par nom
#     fonctionne, la lecture des QR non.
#
# Le passage à `forum2026.ansd.sn` se fait en reprenant `docker/nginx.conf`, qui
# porte la configuration HTTPS complète.

server {
    listen 80;
    # `_` : n'importe quel nom ou adresse. Le serveur est joint par son IP, et
    # personne ne connaît encore le nom qu'il portera.
    server_name _;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 55 Mo : les contributions vont jusqu'à 50 Mo (brief §5.8), et l'en-tête
    # d'une requête multipart s'ajoute au fichier lui-même.
    client_max_body_size 55M;

    # Tampons d'en-tête de réponse, relevés de 4 Kio (le défaut) à 16 Kio.
    #
    # La réponse qui **ouvre une session** dépasse le défaut et nginx la rejette
    # avec « upstream sent too big header », donc un 502 au visiteur, sur une
    # application qui a pourtant parfaitement répondu. Constaté le 23 septembre
    # 2026 : la connexion au BackOffice échouait au moment précis où le code à
    # six chiffres était accepté, et à ce moment-là seulement.
    #
    # Ce qui gonfle ces en-têtes : le jeton de session porte les trente-cinq
    # permissions du rôle, chiffré puis encodé ; s'y ajoutent trois cookies, la
    # politique de sécurité à nonce, et les en-têtes `Link` de préchargement que
    # Next émet pour ses polices et ses feuilles de style. Aucun n'est anormal,
    # c'est le défaut de nginx qui est étroit pour une application de ce type.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Défi ACME, servi **dès la recette interne** : le premier certificat
    # s'émet pendant que nginx sert encore en clair, donc avec cette
    # configuration-ci. Sans ce bloc, la requête de Let's Encrypt partait au
    # proxy et revenait en 404, et l'émission échouait sur un serveur pourtant
    # joignable. Le répertoire est le volume `certbot_www`, monté par
    # `docker-compose.prod.yml` quelle que soit la surcouche.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Adresse du visiteur : **écrasée** avec celle de la connexion, jamais
        # complétée — sans quoi n'importe qui choisit son IP et contourne les
        # limites de débit (PLAN.md §18). L'application lit X-Real-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
