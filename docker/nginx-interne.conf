# Reverse proxy pour un déploiement **interne**, sans TLS (PLAN.md §27).
#
# Le portail est servi en clair sur le réseau de l'ANSD, le temps de la recette.
# Deux conséquences à connaître, et à lever avant toute ouverture au public :
#
#   - les mots de passe du BackOffice circulent en clair sur le réseau local ;
#   - le **scanner de badges ne peut pas allumer la caméra** : les navigateurs
#     réservent `getUserMedia` aux origines sécurisées. La recherche par nom
#     fonctionne, la lecture des QR non.
#
# Le passage à `forum.ansd.sn` se fait en reprenant `docker/nginx.conf`, qui
# porte la configuration HTTPS complète.

server {
    listen 80;
    # `_` : n'importe quel nom ou adresse. Le serveur est joint par son IP, et
    # personne ne connaît encore le nom qu'il portera.
    server_name _;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 55 Mo : les contributions vont jusqu'à 50 Mo (brief §5.8), et l'en-tête
    # d'une requête multipart s'ajoute au fichier lui-même.
    client_max_body_size 55M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Adresse du visiteur : **écrasée** avec celle de la connexion, jamais
        # complétée — sans quoi n'importe qui choisit son IP et contourne les
        # limites de débit (PLAN.md §18). L'application lit X-Real-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
