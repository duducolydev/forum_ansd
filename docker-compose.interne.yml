# Surcouche pour un déploiement **interne**, sans domaine ni TLS (PLAN.md §27).
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.interne.yml up -d
#
# ⚠ DÉPASSÉE DEPUIS LE 24 SEPTEMBRE 2026. Le portail est servi en HTTPS sur
# `forum2026.ansd.sn`. Passer encore ce fichier remplace la configuration nginx
# par celle sans TLS : le site retombe en clair, et il y retombe **sans rien
# signaler**, puisque le port 80 répond normalement. L'alias `forum` posé
# pendant la recette chargeait les deux fichiers, et c'est précisément le piège
# que décrit le §5.6 du guide de déploiement.
#
# Elle est conservée pour un seul cas : repartir en clair le temps de dépanner
# un problème de certificat. Hors de là, on ne la passe plus.
#
# Ce qu'elle change, quand on la passe : nginx sert en clair sur le port 80 avec
# `docker/nginx-interne.conf`. Le service certbot, lui, dort déjà sous le profil
# `tls` dans la définition de production ; il n'y a plus rien à surcharger ici.
#
# Le port 443 reste publié par la définition de production — une surcouche
# Compose complète une liste de ports, elle ne la raccourcit pas. Le certificat
# reste monté, mais la configuration chargée n'ouvre aucun serveur TLS : une
# connexion sur 443 est refusée, ce qui est attendu et non un incident.
name: forum-ansd

services:
  nginx:
    volumes:
      - ./docker/nginx-interne.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
