name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: forum_ansd
          MYSQL_USER: forum
          MYSQL_PASSWORD: forum
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://forum:forum@localhost:3306/forum_ansd
      AUTH_SECRET: ci-only-secret-not-for-production
      MAGIC_LINK_SECRET: ci-only-secret-not-for-production
      BADGE_HMAC_SECRET: ci-only-secret-not-for-production
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./storage
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      PUBLIC_BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Prisma migrate deploy
        run: pnpm exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
